# デプロイ（AWS 構成設計書 7章、詳細設計書 7章）
# main で CI が成功したら、作ったファイルを S3 に置き、EC2 に配置の命令を送る。
# ログは公開されるので、秘密の情報を出さない

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # 手で動かすとき（GitHub の Actions の画面から）
  workflow_dispatch:

# デプロイは同時に1つだけ。途中で止めず、順番を待つ
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2

jobs:
  deploy:
    name: deploy
    # main に push された CI の成功か、main からの手動の実行のときだけ動く。フォークの PR では動かない
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    # EC2 が ARM なので、同じ ARM でビルドする
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: PHP 8.5 を用意する
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, gd, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Node.js を用意する（frontend/.node-version の版）
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 本番に要るものだけを入れる
      - name: Laravel を用意する
        working-directory: backend
        run: composer install --no-dev --no-interaction --no-progress --optimize-autoloader

      - name: Next.js を作成する
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: 1つのファイルにまとめる
        run: |
          mkdir -p "$RUNNER_TEMP/release/next"
          cp -R backend deploy "$RUNNER_TEMP/release/"
          rm -rf "$RUNNER_TEMP/release/backend/tests" "$RUNNER_TEMP/release/backend/.env"
          # standalone には静的なファイルが入らないので、足す（詳細設計書 7.1）
          cp -R frontend/.next/standalone/. "$RUNNER_TEMP/release/next/"
          cp -R frontend/.next/static "$RUNNER_TEMP/release/next/.next/static"
          # public は今は空で Git にないので、あるときだけ足す
          if [ -d frontend/public ]; then cp -R frontend/public "$RUNNER_TEMP/release/next/public"; fi
          tar -czf "$RUNNER_TEMP/release.tar.gz" -C "$RUNNER_TEMP/release" .

      - name: S3 に置いて、EC2 に配置の命令を送る
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          KEY="release-$SHA.tar.gz"
          aws s3 cp "$RUNNER_TEMP/release.tar.gz" "s3://$DEPLOY_BUCKET/$KEY" --only-show-errors

          # EC2 の中で動く命令。版のフォルダに広げて、その中の deploy.sh を動かす
          REMOTE="set -euo pipefail; D=/opt/recipe-app/releases/$SHA-\$(date +%s); mkdir -p \$D; aws s3 cp s3://$DEPLOY_BUCKET/$KEY - --region $AWS_REGION --only-show-errors | tar -xz -C \$D; bash \$D/deploy/deploy.sh"
          jq -n --arg command "$REMOTE" '{commands: [$command], executionTimeout: ["1200"]}' > "$RUNNER_TEMP/parameters.json"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "file://$RUNNER_TEMP/parameters.json" \
            --query Command.CommandId --output text)"

          # 終わるまで待つ（最大20分）
          STATUS=Pending
          for _ in $(seq 1 120); do
            sleep 10
            STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query StandardErrorContent --output text >&2

          echo "結果：$STATUS"
          [ "$STATUS" = Success ]
