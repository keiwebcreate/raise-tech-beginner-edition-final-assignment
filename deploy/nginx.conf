# Nginx の設定（AWS 構成設計書 2章）。deploy/setup.sh が /etc/nginx/nginx.conf に置く
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    server_tokens off;

    # 写真は 5MB まで。ほかの項目の分も見込む（PHP の post_max_size と同じ）
    client_max_body_size 8m;

    # 秘密のヘッダーの確かめ方（$origin_ok）。値を Git に入れないよう、deploy.sh が作る
    include /etc/nginx/recipe-origin.conf;

    # 本当の接続元。CloudFront が付ける「IP:ポート」から IP を取り出す。
    # IPv6 は [ ] で囲まれているが、PHP にはそのまま渡さず外す
    map $http_cloudfront_viewer_address $viewer_ip {
        default $remote_addr;
        "~^\[(?<v6>.+)\]:[0-9]+$" $v6;
        "~^(?<v4>[0-9.]+):[0-9]+$" $v4;
    }

    # CloudFront から届く入口
    server {
        listen 80 default_server;

        # CloudFront を通っていない要求は断る
        if ($origin_ok = 0) {
            return 403;
        }

        # /api・/sanctum は Laravel へ
        location ~ ^/(api|sanctum)/ {
            root /opt/recipe-app/current/backend/public;
            include /etc/nginx/fastcgi_params;
            # current の印の先の本当の場所を渡す。版を切り替えたときに古い版を動かさないため
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            # Laravel には中継を信じさせない。確かな値だけをここで渡す。
            # 利用者が送った X-Forwarded-For などは空にして、Laravel に見せない
            fastcgi_param REMOTE_ADDR $viewer_ip;
            fastcgi_param HTTPS on;
            fastcgi_param HTTP_X_FORWARDED_FOR "";
            fastcgi_param HTTP_X_FORWARDED_HOST "";
            fastcgi_param HTTP_X_FORWARDED_PORT "";
            fastcgi_param HTTP_X_FORWARDED_PROTO "";
            fastcgi_pass unix:/run/php-fpm/www.sock;
        }

        # それ以外は Next.js へ
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $viewer_ip;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
        }
    }

    # Next.js の proxy.ts が /api/me を確かめるための、EC2 の中だけの入口。外には届かない
    server {
        listen 127.0.0.1:8081;

        location ~ ^/(api|sanctum)/ {
            root /opt/recipe-app/current/backend/public;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_pass unix:/run/php-fpm/www.sock;
        }

        location / {
            return 404;
        }
    }
}
