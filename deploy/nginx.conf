# Nginx の設定（AWS 構成設計書 2章）。deploy/setup.sh が /etc/nginx/nginx.conf に置く
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    server_tokens off;

    # 写真は 5MB まで。ほかの項目の分も見込む（PHP の post_max_size と同じ）
    client_max_body_size 8m;

    # 画面から届く入口
    server {
        listen 80 default_server;

        # /api・/sanctum は Laravel へ
        location ~ ^/(api|sanctum)/ {
            root /opt/recipe-app/current/backend/public;
            include /etc/nginx/fastcgi_params;
            # current の印の先の本当の場所を渡す。版を切り替えたときに古い版を動かさないため
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_pass unix:/run/php-fpm/www.sock;
        }

        # それ以外は Next.js へ
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Connection "";
        }
    }

    # Next.js の proxy.ts が /api/me を確かめるための、EC2 の中だけの入口。外には届かない
    server {
        listen 127.0.0.1:8081;

        location ~ ^/(api|sanctum)/ {
            root /opt/recipe-app/current/backend/public;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_pass unix:/run/php-fpm/www.sock;
        }

        location / {
            return 404;
        }
    }
}
