; 本番の PHP の追加の設定。deploy/setup.sh が /etc/php.d/99-recipe.ini に置く
; 写真を 5MB まで受けるため（詳細設計書 4.6）
upload_max_filesize = 6M
post_max_size = 8M
; PHP を使っていることを応答のヘッダーに出さない
expose_php = Off
; 本番では画面にエラーを出さない
display_errors = Off
log_errors = On
; 動かすファイルが変わらない前提で速くする。版の切り替えのときは PHP-FPM を再起動する
opcache.enable = 1
opcache.validate_timestamps = 0
