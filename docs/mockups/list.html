<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S-02 レシピ一覧｜モックアップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* 検索・絞り込み：枠で囲まず、一覧の上に置く */
  .search { width: 100%; min-height: 48px; font-size: 17px; padding-left: 16px; border-radius: 24px; }
  .filter-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .filter-row .select { width: auto; flex: 0 1 180px; min-height: 38px; font-size: 14px; }
  .filter-mobile { display: none; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 24px 0 14px; padding-bottom: 10px; border-bottom: 1px solid var(--rule); }
  .count { margin-right: auto; font-size: 14px; color: var(--ink-dim); }
  .count b { font-family: var(--font-display); font-size: 18px; color: var(--ink); margin-right: 6px; }
  .toolbar .select { width: auto; min-height: 38px; font-size: 14px; }
  .view-switch { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: var(--radius); overflow: hidden; }
  .view-switch .btn { border: none; border-radius: 0; min-height: 36px; background: var(--paper); }
  .view-switch .btn[aria-pressed="true"] { background: var(--mikan-wash); box-shadow: inset 0 -3px 0 var(--mikan); }

  /* タイル表示：写真＋料理名だけ。料理本の目次のような並び */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px 20px; }
  .tile { position: relative; display: block; text-decoration: none; color: inherit; }
  .tile .photo, .tile .no-image { transition: transform .15s; }
  .tile:hover .photo { transform: scale(1.015); }
  .tile:hover .tile-title { color: var(--mikan-deep); }
  .tile-title { font-family: var(--font-display); font-weight: 700; font-size: 17px; margin: 10px 0 4px; overflow-wrap: anywhere; line-height: 1.45; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .meta + .tags { margin-top: 4px; }
  .fav { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; border-radius: 50%; border: none;
         background: var(--paper); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  /* リスト表示：細い線で区切った行 */
  .list { display: none; flex-direction: column; border-top: 1px solid var(--rule); }
  .row { display: flex; gap: 14px; align-items: center; padding: 12px 4px; text-decoration: none; color: inherit; border-bottom: 1px solid var(--rule); }
  .row:hover { background: var(--paper); }
  .row .thumb { width: 84px; flex: none; }
  .row .photo, .row .no-image { border-radius: 6px; }
  .row-main { flex: 1; min-width: 0; }
  .row .tile-title { margin: 0 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .view-list .grid { display: none; }
  .view-list .list { display: flex; }

  .pager { display: flex; justify-content: center; gap: 6px; margin-top: 36px; flex-wrap: wrap; }
  .pager .btn { min-width: 40px; padding: 0 10px; }
  .empty { text-align: center; padding: 48px 16px; }
  .empty h2 { font-size: 20px; margin: 0 0 6px; }
  .empty p { color: var(--ink-dim); margin: 0 0 16px; }

  @media (max-width: 1000px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 760px)  { .grid { grid-template-columns: repeat(2, 1fr); gap: 20px 12px; } }
  @media (max-width: 640px) {
    .filter-pc { display: none; }
    .filter-mobile { display: flex; gap: 8px; }
    .filter-mobile .input { flex: 1; min-width: 0; }
    .tile-title { font-size: 15px; margin-top: 8px; }
    .tile .tags { display: none; }
    .row .thumb { width: 64px; }
  }
</style>
</head>
<body>
<div class="mock-note">モックアップ S-02 レシピ一覧 ｜ <a href="index.html">画面の一覧へ</a></div>

<header class="header">
  <div class="header-inner">
    <a class="logo" href="list.html"><span class="logo-mark" aria-hidden="true"></span>Recipe Box</a>
    <nav class="header-nav">
      <a class="btn btn-primary" href="form.html">＋ レシピを追加</a>
      <a class="btn btn-subtle" href="settings.html">設定</a>
    </nav>
    <button class="btn btn-default btn-icon burger" data-burger aria-label="メニュー" aria-expanded="false">☰</button>
  </div>
  <div class="mobile-menu">
    <a href="form.html">＋ レシピを追加</a>
    <a href="settings.html">設定</a>
  </div>
</header>

<main class="container">
  <!-- 検索・絞り込み（パソコン） -->
  <section class="filter-pc" aria-label="検索と絞り込み">
    <input class="input search" type="search" placeholder="料理名や材料で探す（例：豚肉）">
    <div class="filter-row">
      <select class="select" aria-label="カテゴリ">
        <option>カテゴリ：すべて</option><option selected>主菜</option><option>副菜</option><option>サラダ</option>
        <option>汁物・スープ</option><option>ご飯もの</option><option>麺類</option><option>パン・粉もの</option>
        <option>お弁当・おつまみ</option><option>デザート・おやつ</option><option>飲み物</option>
        <option>たれ・ソース・調味料</option><option>その他</option>
      </select>
      <select class="select" aria-label="タグ">
        <option>タグ：すべて</option><option>和食</option><option>時短</option><option>作り置き</option>
      </select>
      <select class="select" aria-label="調理時間">
        <option>調理時間：指定なし</option><option>15分以内</option><option>30分以内</option><option>60分以内</option>
      </select>
      <button class="btn btn-default" aria-pressed="false" onclick="this.setAttribute('aria-pressed', this.getAttribute('aria-pressed')==='true'?'false':'true')"><span class="star">★</span> お気に入りだけ</button>
      <button class="btn btn-subtle">条件をクリア</button>
    </div>
  </section>
  <!-- 検索・絞り込み（スマホ） -->
  <section class="filter-mobile" aria-label="検索と絞り込み">
    <input class="input search" type="search" placeholder="料理名や材料で探す">
    <button class="btn btn-default" data-open="drawer">絞り込み (1)</button>
  </section>

  <div class="toolbar">
    <span class="count"><b>主菜</b>24件中 1〜20件</span>
    <select class="select" aria-label="並び替え">
      <option>新しい順</option><option>料理名順</option><option>調理時間の短い順</option><option>最後に作った日が古い順</option>
    </select>
    <span class="view-switch">
      <button class="btn btn-icon" id="v-grid" aria-pressed="true" aria-label="タイル表示" title="タイル表示">▦</button>
      <button class="btn btn-icon" id="v-list" aria-pressed="false" aria-label="リスト表示" title="リスト表示">☰</button>
    </span>
  </div>

  <div id="results">
    <div class="grid" id="grid"></div>
    <div class="list" id="list"></div>
  </div>

  <nav class="pager" aria-label="ページ">
    <button class="btn btn-default" disabled aria-label="前のページ">‹</button>
    <button class="btn btn-primary" aria-current="page">1</button>
    <button class="btn btn-default">2</button>
    <button class="btn btn-default" aria-label="次のページ">›</button>
  </nav>

  <details style="margin-top:40px">
    <summary class="hint">参考：検索結果が0件のときの表示</summary>
    <div class="empty">
      <h2>条件に合うレシピがありません</h2>
      <p>キーワードを短くするか、絞り込みの条件を外してください。</p>
      <button class="btn btn-default">条件をクリア</button>
    </div>
  </details>
</main>

<!-- スマホの絞り込み（下から出る窓） -->
<div class="overlay drawer-overlay" id="drawer">
  <div class="drawer" role="dialog" aria-label="絞り込み">
    <h2 class="section-title">絞り込み</h2>
    <div class="field"><label>カテゴリ</label>
      <select class="select"><option>すべて</option><option selected>主菜</option><option>副菜</option></select></div>
    <div class="field"><label>タグ</label>
      <select class="select"><option>すべて</option><option>和食</option><option>時短</option></select></div>
    <div class="field"><label>調理時間</label>
      <select class="select"><option>指定なし</option><option>15分以内</option><option>30分以内</option><option>60分以内</option></select></div>
    <div class="field"><label><input type="checkbox"> お気に入りだけ</label></div>
    <div style="display:flex; gap:8px">
      <button class="btn btn-default" style="flex:1" data-close>クリア</button>
      <button class="btn btn-primary" style="flex:2" data-close>この条件で表示</button>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
  // 見本のデータ（本番は API から取得する）
  const recipes = [
    { name: '肉じゃが', cat: '主菜', min: 30, tags: ['和食', '作り置き'], fav: true, photo: true },
    { name: '鶏の唐揚げ', cat: '主菜', min: 25, tags: ['和食', 'お弁当'], fav: false, photo: true },
    { name: '豚の生姜焼き', cat: '主菜', min: 15, tags: ['和食', '時短'], fav: true, photo: false },
    { name: '麻婆豆腐', cat: '主菜', min: 20, tags: ['中華'], fav: false, photo: true },
    { name: 'サバの味噌煮', cat: '主菜', min: 25, tags: ['和食'], fav: false, photo: true },
    { name: 'ハンバーグ（デミグラスソース）', cat: '主菜', min: 40, tags: ['洋食', '子ども向け'], fav: true, photo: true },
    { name: '鮭のムニエル', cat: '主菜', min: 15, tags: ['洋食', '時短'], fav: false, photo: false },
    { name: '回鍋肉', cat: '主菜', min: 15, tags: ['中華', '時短'], fav: false, photo: true },
  ];
  const tagsHtml = (r) => `<div class="tags">${r.tags.map((t) => `<span class="tag">#${t}</span>`).join('')}</div>`;
  const photoHtml = (r) => r.photo ? `<div class="photo" role="img" aria-label="${r.name}の写真"></div>` : `<div class="no-image">写真なし</div>`;
  const meta = (r) => `<div class="meta"><span class="category">${r.cat}</span><span class="minutes"><b>${r.min}</b>分</span></div>`;
  const star = (r) => r.fav ? '<span class="star">★</span>' : '<span class="star-off">☆</span>';

  document.getElementById('grid').innerHTML = recipes.map((r) => `
    <a class="tile" href="detail.html">
      ${photoHtml(r)}
      <button class="fav" aria-label="お気に入り" aria-pressed="${r.fav}" onclick="event.preventDefault()">${star(r)}</button>
      <p class="tile-title">${r.name}</p>${meta(r)}${tagsHtml(r)}
    </a>`).join('');

  document.getElementById('list').innerHTML = recipes.map((r) => `
    <a class="row" href="detail.html">
      <div class="thumb">${photoHtml(r)}</div>
      <div class="row-main"><p class="tile-title">${r.name}</p>${meta(r)}</div>
      <span aria-label="お気に入り">${star(r)}</span>
    </a>`).join('');

  // タイル／リストの切り替え（本番は選んだ形をブラウザに覚えさせる）
  const results = document.getElementById('results');
  const vGrid = document.getElementById('v-grid');
  const vList = document.getElementById('v-list');
  function setView(v) {
    results.classList.toggle('view-list', v === 'list');
    vGrid.setAttribute('aria-pressed', String(v === 'grid'));
    vList.setAttribute('aria-pressed', String(v === 'list'));
    try { localStorage.setItem('mock-view', v); } catch (e) {}
  }
  vGrid.onclick = () => setView('grid');
  vList.onclick = () => setView('list');
  try { setView(localStorage.getItem('mock-view') || 'grid'); } catch (e) { setView('grid'); }
</script>
</body>
</html>
